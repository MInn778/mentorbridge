spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: mentorbridge-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mentoring_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:} # DATABASE_URL(Neon)을 쓰면 비워둬도 됨 - DatabaseConfig 참고
    # driver/dialect는 DB_URL(mysql/postgresql)을 보고 자동 선택
  jpa:
    hibernate:
      ddl-auto: update # 서버 재시작 시 데이터가 날아가지 않도록 update로 변경합니다.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24시간 (1일)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}
  # 배포된 프론트(Vercel) 주소. 쉼표로 여러 개 가능 - CORS 허용 목록에 추가됨
  frontend-url: ${FRONTEND_URL:}

public-data:
  recruit-api-key: ${PUBLIC_DATA_RECRUIT_API_KEY:}

app-gemini:
  # 프로퍼티 경로를 gemini.api-key로 하면, Spring의 relaxed binding 때문에
  # Windows 사용자 환경변수 GEMINI_API_KEY(더미값 your_api_key_here가 들어있음)가
  # .env 파일 값보다 우선순위가 높게 자동 매칭되어 덮어써버린다.
  # (환경변수 GEMINI_API_KEY가 프로퍼티 경로 gemini.api-key와 자동으로 매핑됨)
  # 경로 자체를 다르게 둬서 이 자동 매핑을 피한다.
  api-key: ${BACKEND_GEMINI_API_KEY:}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

server:
  port: ${PORT:8080} # Render는 PORT 환경변수로 포트를 지정함
  # Render 프록시가 붙여주는 X-Forwarded-Proto(https)를 반영 - 없으면 구글 OAuth redirect_uri가 http://로 만들어져 거부됨
  forward-headers-strategy: framework
